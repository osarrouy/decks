name: Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish an active release before starting another one.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DG_UI_REF: 2147a1267357f228286158680ee887c791d7e4b2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the pinned private UI package
        uses: actions/checkout@v7
        with:
          repository: distributedgallery/interfaces
          ref: ${{ env.DG_UI_REF }}
          path: .ci/interfaces
          ssh-key: ${{ secrets.DG_UI_DEPLOY_KEY }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve the CI checkout and install locked dependencies
        run: |
          node tooling/ci-ui.mjs
          pnpm install --frozen-lockfile

      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium

      - name: Package and serve the public export
        run: |
          deployment_dir=$(node site/scripts/prepare-deploy.mjs)
          echo "DEPLOYMENT_DIR=$deployment_dir" >> "$GITHUB_ENV"
          docker build -t university-site "$deployment_dir"
          docker run -d --name university-site -p 127.0.0.1:8080:8080 university-site
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8080/ --output /dev/null

      - run: node site/scripts/check-deploy.mjs http://127.0.0.1:8080
      - run: pnpm test:ui
        env:
          COURSE_TEST_ORIGIN: http://127.0.0.1:8080

      - name: Install the deployment CLI
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm install --global @railway/cli@5.49.6

      - name: Deploy the tested export to Railway
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          test -n "$RAILWAY_TOKEN" && test -n "$RAILWAY_SERVICE_ID" && test -n "$SITE_URL"
          railway up "$DEPLOYMENT_DIR" --path-as-root --no-gitignore --service "$RAILWAY_SERVICE_ID" --environment production --ci
          for attempt in $(seq 1 60); do
            if node site/scripts/check-deploy.mjs "$SITE_URL" > "$RUNNER_TEMP/site-check.log" 2>&1; then
              cat "$RUNNER_TEMP/site-check.log"
              exit 0
            fi
            sleep 5
          done
          cat "$RUNNER_TEMP/site-check.log"
          exit 1

      - name: Server logs
        if: failure()
        run: docker logs university-site || true
