  # Chapitres suivants : propositions provisoires à retravailler.

  - id: "information-et-communication"
    titre: "Information et communication"
    sous-titre: "Du codage à la construction du sens"

    resume: |
      Ce chapitre examine ce qui se transforme lorsqu’un message, une image
      ou un son devient une donnée que l’on peut stocker, transmettre et
      calculer. Il introduit les distinctions entre données, information et
      sens, ainsi que les principales composantes d’une situation de communication.

      À partir d’exemples de messages et de documents numériques, il propose
      d’observer le rôle du codage, du support et du contexte d’interprétation.
      La circulation d’une information est ainsi abordée à la fois comme
      un processus technique et comme une relation entre des personnes.

      ## À retenir

      - Distinguer les données, l’information et le sens.
      - Identifier le rôle du code, du canal et du contexte dans une communication.
      - Interroger ce que la mise en données conserve, transforme ou laisse de côté.

    bibliographie: []

  - id: "pratiques-et-cultures-en-reseau"
    titre: "Pratiques et cultures en réseau"
    sous-titre: "Partager, créer, participer"

    resume: |
      Ce chapitre explore les manières de se rencontrer, de créer et de
      participer en ligne. Il prend pour points de départ les communautés,
      les pratiques de partage, le remix et les productions collectives.

      Il invite à analyser les règles et les habitudes qui organisent ces
      espaces : qui peut participer, comment se construit une réputation,
      quels contenus deviennent visibles et comment se négocient les désaccords.
      Les identités numériques sont étudiées à travers la présentation de soi,
      les traces laissées par les usages et les relations avec les autres.

      ## À retenir

      - Décrire les formes de coopération et de création dans les communautés en ligne.
      - Repérer les règles explicites et implicites qui organisent la participation.
      - Relier la présentation de soi aux conditions de visibilité sur les réseaux.

    bibliographie: []

  - id: "plateformes-et-vie-quotidienne"
    titre: "Plateformes et vie quotidienne"
    sous-titre: "Données, attention et usages"

    resume: |
      Ce chapitre propose une lecture critique des services numériques
      utilisés au quotidien : rechercher une information, regarder une vidéo,
      acheter un produit ou échanger avec ses proches. Il introduit les notions
      de plateforme, de modèle économique et d’économie de l’attention.

      L’analyse porte sur les interfaces, la collecte de données et les systèmes
      de recommandation, en examinant leur place dans l’organisation des usages.
      Des situations concrètes permettent de discuter les possibilités de choix,
      les dépendances et les moyens de prendre du recul sur ses pratiques.

      ## À retenir

      - Identifier les acteurs et les modèles économiques d’un service numérique.
      - Examiner les liens entre données, recommandations et attention.
      - Développer une lecture critique de ses usages et des interfaces qui les organisent.

    bibliographie: []
