  - id: "reseaux-sociaux-numeriques"
    titre: "Réseaux sociaux numériques"
    partie: "1/5"
    sous-titre: "Espace public, sphère privée et publication"
    slides:
      - titre: "Réseaux sociaux numériques — Espace public, sphère privée et publication"
        url: "/slides/social-networks/index.html"
        integration: "iframe"

    resume: |
      Ce chapitre définit les réseaux sociaux numériques à partir de leur
      architecture : des profils publics ou semi-publics, des relations rendues
      visibles et des contenus organisés autour de ceux qui les publient. Cette
      organisation transforme les conditions de la prise de parole sans faire
      disparaître les inégalités d’attention.

      ## Définir un réseau social numérique

      D’après danah boyd et Nicole Ellison, un site de réseau social permet de
      construire un profil, de déclarer des liens et de parcourir ces connexions.
      Sa particularité tient moins à la rencontre d’inconnus qu’à la mise en
      visibilité de relations qui existaient souvent déjà hors ligne.

      ## Sphère publique et sphère privée

      Le caractère public ou privé d’un fait ne constitue pas une propriété
      fixe. Il dépend du cercle des personnes concernées, des règles sociales et
      des dispositifs qui organisent sa circulation. À partir de Jürgen Habermas,
      le chapitre distingue la simple visibilité d’une parole et sa formulation
      comme question d’intérêt commun.

      ## Un espace public élargi et clair-obscur

      Le Web participatif abaisse les seuils de publication et permet à des
      acteurs auparavant peu représentés de prendre part à la parole publique.
      Il rend aussi consultables et mesurables des conversations ordinaires, des
      expériences intimes et des contenus destinés à des publics restreints. La
      frontière entre public et privé devient plus poreuse et négociable.

      ## Publier d’abord, filtrer ensuite

      Lorsque chacun peut mettre un contenu en ligne, le filtrage intervient
      davantage après la publication. Liens, partages, moteurs de recherche,
      métriques et recommandations concentrent alors l’attention sur un petit
      nombre de contenus. La formule « publish, then filter » décrit ce
      déplacement : l’ouverture de la publication n’égalise pas la visibilité.

      ### À retenir

      - Un réseau social numérique rend visibles des profils, des liens et des circulations.
      - Publicité comme visibilité et publicité comme intérêt commun ne se confondent pas.
      - Le Web participatif mêle parole publique, conversation et exposition de la vie privée.
      - Publier devient plus facile, mais l’attention demeure rare et très concentrée.

    bibliographie:
      - reference: "boyd, d. m., & Ellison, N. B. (2007). Social network sites: Definition, history, and scholarship. *Journal of Computer-Mediated Communication, 13*(1), 210–230. [https://doi.org/10.1111/j.1083-6101.2007.00393.x](https://doi.org/10.1111/j.1083-6101.2007.00393.x)"
        url: "https://doi.org/10.1111/j.1083-6101.2007.00393.x"
        note: "Lecture centrale pour définir les sites de réseaux sociaux à partir des profils et des connexions visibles."
      - reference: "Habermas, J. (1993). *L’espace public : Archéologie de la publicité comme dimension constitutive de la société bourgeoise* (M. B. de Launay, trad.). Payot."
        url: "https://catalogue.bnf.fr/ark:/12148/cb37428283f"
        note: "Repère théorique pour distinguer visibilité, discussion publique et médiations."
      - reference: "Katz, E., & Lazarsfeld, P. F. (1955). *Personal influence: The part played by people in the flow of mass communications*. Free Press."
        note: "Texte classique sur les leaders d’opinion et la circulation interpersonnelle de l’influence."
      - reference: "Shirky, C. (2008). *Here comes everybody: The power of organizing without organizations*. Penguin Press."
        note: "Pour le déplacement du filtrage avant publication vers le principe « publish, then filter »."
      - reference: "Tarde, G. (1901). *L’opinion et la foule*. Félix Alcan."
        url: "https://catalogue.bnf.fr/ark:/12148/cb181229642"
        note: "Texte classique sur la conversation, le public et la formation de l’opinion."

  - id: "structure-des-reseaux-sociaux"
    titre: "Réseaux sociaux numériques"
    partie: "2/5"
    sous-titre: "Structure des réseaux et circulation"
    slides:
      - titre: "Réseaux sociaux numériques — Structure des réseaux et circulation"
        url: "/slides/social-networks-structure/index.html"
        integration: "iframe"

    resume: |
      Les messages ne circulent pas sur une surface homogène. Ils empruntent des
      relations regroupées en communautés, traversent quelques ponts et peuvent
      bénéficier de nœuds beaucoup plus connectés que les autres. Ce chapitre
      introduit les outils nécessaires pour décrire cette structure.

      ## Représenter un réseau

      Un graphe représente des acteurs par des nœuds et leurs relations par des
      liens. Le modèle aléatoire d’Erdős et Rényi sert de point de comparaison :
      il fait apparaître des propriétés générales, mais ne reproduit pas les
      déterminismes sociaux qui orientent les rencontres réelles.

      ## Petits mondes et chemins courts

      Les expériences de Stanley Milgram et le modèle de Watts et Strogatz
      montrent que des réseaux fortement regroupés peuvent néanmoins être reliés
      par des chemins très courts. Quelques ponts suffisent à rapprocher des
      groupes qui resteraient autrement éloignés.

      ## Hubs et attachement préférentiel

      Barabási et Albert attirent l’attention sur des réseaux dans lesquels le
      nombre de liens est très inégalement distribué. L’attachement préférentiel
      explique comment un avantage initial peut se renforcer : les nœuds déjà
      très connectés ont davantage de chances d’attirer de nouveaux liens.

      ## Bonding et bridging

      Robert Putnam distingue les liens qui renforcent la cohésion d’un groupe
      homogène (*bonding*) de ceux qui relient des groupes différents
      (*bridging*). Le nombre de connexions ne suffit donc pas : leur position,
      leur intensité et leur fonction déterminent aussi ce qu’un réseau permet.

      ### À retenir

      - Les petits mondes combinent regroupements locaux et chemins courts.
      - Les hubs concentrent une part importante des connexions et des relais possibles.
      - L’attachement préférentiel peut transformer un avantage initial en forte concentration.
      - Les liens internes et les ponts entre groupes remplissent des fonctions sociales différentes.

    bibliographie:
      - reference: "Barabási, A.-L., & Albert, R. (1999). Emergence of scaling in random networks. *Science, 286*(5439), 509–512. [https://doi.org/10.1126/science.286.5439.509](https://doi.org/10.1126/science.286.5439.509)"
        url: "https://doi.org/10.1126/science.286.5439.509"
        note: "Texte fondateur sur les réseaux sans échelle, les hubs et l’attachement préférentiel."
      - reference: "Erdős, P., & Rényi, A. (1959). On random graphs I. *Publicationes Mathematicae, 6*, 290–297. [https://doi.org/10.5486/PMD.1959.6.3-4.12](https://doi.org/10.5486/PMD.1959.6.3-4.12)"
        url: "https://doi.org/10.5486/PMD.1959.6.3-4.12"
        note: "Modèle de référence pour comprendre ce que produit une distribution aléatoire des liens."
      - reference: "Granovetter, M. S. (1973). The strength of weak ties. *American Journal of Sociology, 78*(6), 1360–1380. [https://doi.org/10.1086/225469](https://doi.org/10.1086/225469)"
        url: "https://doi.org/10.1086/225469"
        note: "Pour comprendre le rôle des liens faibles dans la circulation entre groupes sociaux."
      - reference: "Putnam, R. D. (2000). *Bowling alone: The collapse and revival of American community*. Simon & Schuster."
        url: "https://www.simonandschuster.com/books/Bowling-Alone-Revised-and-Updated/Robert-D-Putnam/9780743219037"
        note: "Pour distinguer les liens d’attachement des liens qui relient des groupes différents."
      - reference: "Travers, J., & Milgram, S. (1969). An experimental study of the small world problem. *Sociometry, 32*(4), 425–443. [https://doi.org/10.2307/2786545](https://doi.org/10.2307/2786545)"
        url: "https://doi.org/10.2307/2786545"
        note: "Expérience classique sur les chaînes de connaissances et le phénomène des petits mondes."
      - reference: "Watts, D. J., & Strogatz, S. H. (1998). Collective dynamics of ‘small-world’ networks. *Nature, 393*, 440–442. [https://doi.org/10.1038/30918](https://doi.org/10.1038/30918)"
        url: "https://doi.org/10.1038/30918"
        note: "Article fondateur sur les réseaux combinant fort regroupement local et chemins courts."

  - id: "gatekeeping-algorithmique"
    titre: "Réseaux sociaux numériques"
    partie: "3/5"
    sous-titre: "Visibilité et gatekeeping algorithmique"
    slides:
      - titre: "Réseaux sociaux numériques — Visibilité et gatekeeping algorithmique"
        url: "/slides/social-networks-gatekeepers/index.html"
        integration: "iframe"

    resume: |
      La possibilité technique de publier ne garantit pas d’être vu. Les
      plateformes ordonnent des fils, recommandent des comptes et distribuent
      des occasions de rencontre. Ce chapitre analyse ce déplacement du
      gatekeeping vers la sélection algorithmique.

      ## Publier, être distribué, être consulté

      Une publication doit être distribuée, rencontrée puis consultée avant de
      pouvoir produire un effet. Ces étapes empêchent de confondre liberté de
      publication, visibilité, attention et adhésion.

      ## Modération et recommandation

      La modération décide principalement de ce qui peut rester accessible. La
      recommandation hiérarchise les contenus disponibles et décide lesquels
      apparaissent en premier, plus tard ou jamais. Ces deux seuils exercent des
      pouvoirs distincts sur l’espace public.

      ## Un score ne mesure pas la qualité

      Un modèle de classement prédit un résultat à partir d’indicateurs : clic,
      durée de consultation, commentaire ou partage. Ces signaux ne mesurent pas
      directement la vérité, l’utilité ou la satisfaction. Leur choix traduit
      des objectifs humains et organisationnels.

      ## Un ensemble d’acteurs

      Le gatekeeping algorithmique résulte des relations entre plateforme,
      modèles, données, producteurs et utilisateurs. Les producteurs anticipent
      les critères de visibilité et adaptent leurs pratiques ; les réactions du
      public alimentent ensuite de nouveaux classements.

      ### À retenir

      - Publication, distribution, rencontre, consultation et adhésion sont des étapes distinctes.
      - La modération fixe des limites ; la recommandation organise la visibilité.
      - Un classement optimise des indicateurs choisis, pas une qualité universelle.
      - Le pouvoir algorithmique appartient à un dispositif institutionnel et social.

    bibliographie:
      - reference: "Bucher, T. (2012). Want to be on the top? Algorithmic power and the threat of invisibility on Facebook. *New Media & Society, 14*(7), 1164–1180. [https://doi.org/10.1177/1461444812440159](https://doi.org/10.1177/1461444812440159)"
        url: "https://doi.org/10.1177/1461444812440159"
        note: "Analyse du pouvoir algorithmique à partir de la visibilité et du risque de disparaître des fils."
      - reference: "Gillespie, T. (2014). The relevance of algorithms. Dans T. Gillespie, P. J. Boczkowski, & K. A. Foot (dir.), *Media technologies: Essays on communication, materiality, and society* (p. 167–194). MIT Press. [https://doi.org/10.7551/mitpress/9780262525374.003.0009](https://doi.org/10.7551/mitpress/9780262525374.003.0009)"
        url: "https://doi.org/10.7551/mitpress/9780262525374.003.0009"
        note: "Cadre sociologique pour replacer les algorithmes dans les institutions et les choix qui les produisent."
      - reference: "Just, N., & Latzer, M. (2017). Governance by algorithms: Reality construction by algorithmic selection on the Internet. *Media, Culture & Society, 39*(2), 238–258. [https://doi.org/10.1177/0163443716643157](https://doi.org/10.1177/0163443716643157)"
        url: "https://doi.org/10.1177/0163443716643157"
        note: "Pour penser la sélection algorithmique comme une forme de gouvernement des environnements informationnels."
      - reference: "Napoli, P. M. (2014). Automated media: An institutional theory perspective on algorithmic media production and consumption. *Communication Theory, 24*(3), 340–360. [https://doi.org/10.1111/comt.12039](https://doi.org/10.1111/comt.12039)"
        url: "https://doi.org/10.1111/comt.12039"
        note: "Approche institutionnelle de la production et de la consommation médiatiques automatisées."

  - id: "viralite-cascades-amplification"
    titre: "Réseaux sociaux numériques"
    partie: "4/5"
    sous-titre: "Viralité, cascades et amplification"
    slides:
      - titre: "Réseaux sociaux numériques — Viralité, cascades et amplification"
        url: "/slides/social-networks-virality/index.html"
        integration: "iframe"

    resume: |
      La métaphore du virus suggère qu’un contenu se transmet spontanément de
      personne à personne. Les recherches sur les cascades montrent une réalité
      plus composite : beaucoup de succès massifs combinent broadcast, positions
      inégales, relais organisés, effets cumulatifs et sélection algorithmique.

      ## Popularité et viralité structurelle

      Le nombre total de vues ou de partages ne décrit pas la forme d’une
      diffusion. Un message peut atteindre un public immense depuis une source
      très visible sans progresser sur une longue chaîne. La viralité
      structurelle distingue ainsi la taille d’une cascade de sa profondeur.

      ## Cascades courtes et broadcasts

      La plupart des cascades étudiées restent petites et s’arrêtent rapidement.
      Les longues chaînes de transmission existent, mais elles sont rares. Même
      parmi les grands succès, une part importante de l’audience peut provenir
      de quelques épisodes de diffusion depuis des comptes très visibles.

      ## Exposition, position et contenu

      Certaines propriétés émotionnelles augmentent la propension au partage,
      mais un contenu doit d’abord être rencontré. Audience préalable,
      centralité, réputation et réseau de relais distribuent des points de
      départ très inégaux. Un grand nombre d’abonnés ne suffit toutefois pas à
      garantir une influence effective.

      ## Preuve sociale et avantage cumulatif

      Les compteurs et classements rendent les choix des autres visibles. Une
      légère avance peut alors produire de nouvelles sélections, qui renforcent
      à leur tour sa visibilité. L’expérience MusicLab montre que cette influence
      sociale rend les succès à la fois plus inégaux et plus imprévisibles.

      ## Amplification organisée et algorithmique

      Bots, publicité, réseaux coordonnés et relais influents peuvent fabriquer
      une première exposition ou l’apparence d’une mobilisation spontanée. Les
      plateformes participent aussi à la diffusion : leurs classements testent,
      amplifient ou réduisent la visibilité à partir des réactions observées.

      ## Des chances inégales, un résultat contingent

      Les dynamiques horizontales existent et une campagne préparée peut échouer.
      La visibilité finale résulte d’une combinaison de ressources, d’exposition,
      de structure réticulaire, d’organisation, de propriétés du contenu et de
      contingence. L’imprévisibilité n’implique donc pas l’égalité des chances.

      ### À retenir

      - Une forte popularité ne prouve pas une longue transmission de proche en proche.
      - La plupart des cascades sont courtes et les grands broadcasts jouent un rôle majeur.
      - Une cascade observée ne suffit pas à distinguer influence et exposition commune.
      - La visibilité peut être amplifiée par des relais organisés et par le classement.
      - La viralité décrit un résultat dont il faut reconstruire les conditions sociales de production.

