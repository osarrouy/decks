titre: "Introduction aux Cultures Numériques"
niveau: "Licence 1"

description: |
  Ce cours propose une introduction aux techniques, aux pratiques et aux
  imaginaires qui façonnent les cultures numériques. Il articule une
  histoire de l’informatique et des réseaux avec une réflexion sur
  l’information, la communication et les usages contemporains.

  Des premières machines à calculer aux plateformes du quotidien, il invite
  à comprendre comment les dispositifs numériques se construisent et
  participent à l’organisation de la vie sociale. Le parcours associe
  repères historiques, notions fondamentales et analyse de situations concrètes.

bibliographie:
  - reference: "Cardon, D. (2019). *Culture numérique*. Presses de Sciences Po."
  - reference: "Jenkins, H. (2006). *Convergence culture: Where old and new media collide*. New York University Press."
  - reference: "Manovich, L. (2001). *The language of new media*. MIT Press."

chapitres:
  - id: "histoire-du-numerique"
    titre: "Histoire du numérique"
    partie: "1/3"
    sous-titre: "Des machines à calculer à la théorie du calcul"
    slides:
      - titre: "Histoire du numérique · 1/3"
        url: "/slides/history-1/index.html"
        integration: "iframe"

    resume: |
      Ce chapitre retrace l’histoire du calcul automatisé, des machines
      mécaniques du XVIIe siècle aux premiers ordinateurs électroniques.
      Il montre comment la formalisation du raisonnement rencontre les
      besoins de l’État, de l’industrie et de la guerre.

      Cette histoire n’est pas celle d’un progrès inévitable. Elle résulte
      de projets parfois inachevés, de recherches théoriques et de demandes
      pratiques : tenir des comptes, coordonner des flux, recenser des
      populations ou traiter des informations militaires. Calculer devient
      ainsi un moyen de produire des connaissances autant que d’organiser
      le travail et d’exercer le pouvoir.

      ## Mécaniser le calcul, programmer les opérations

      La Pascaline de Blaise Pascal automatise des opérations arithmétiques
      pour répondre notamment aux besoins de l’administration fiscale.
      Leibniz prolonge cette ambition : au-delà du calcul des nombres,
      il imagine un système de signes et de règles permettant de
      mécaniser le raisonnement.

      Au XIXe siècle, Charles Babbage cherche à accélérer et à fiabiliser
      la production des tables numériques. Sa Difference Engine est
      spécialisée dans une méthode de calcul. Son projet d’Analytical
      Engine prévoit au contraire une mémoire, une unité de calcul et
      des instructions sur cartes perforées : une même machine pourrait
      exécuter différentes suites d’opérations. Ada Lovelace comprend
      que ces opérations pourraient porter sur des symboles, et pas
      seulement sur des quantités.

      ### À retenir

      - L’automatisation du calcul répond à des enjeux intellectuels,
        administratifs et industriels.
      - Une machine spécialisée exécute une procédure déterminée ;
        une machine programmable peut recevoir différentes instructions.
      - Le calcul mécanique prolonge une organisation du travail humain,
        dont l’histoire ne se réduit pas à celle des inventeurs.

      ## La révolution du contrôle

      L’industrialisation accélère la production, les transports et
      les échanges. Cette accélération crée de nouveaux problèmes :
      coordonner les trains, suivre les marchandises, organiser les
      approvisionnements et administrer des ensembles toujours plus vastes.
      James R. Beniger nomme « révolution du contrôle » le développement
      des moyens d’information et de coordination qui répondent à ces besoins.

      Les analyses de Michel Foucault éclairent un autre versant de cette
      transformation. La discipline organise les gestes, les temps et
      les espaces des individus ; la biopolitique prend pour objet les
      processus collectifs de la population, comme la natalité, la mortalité
      ou la santé. Ces mécanismes se superposent au pouvoir souverain
      plutôt qu’ils ne le remplacent.

      ### À retenir

      - L’accélération des flux exige de nouveaux moyens de suivi
        et de coordination.
      - La discipline porte sur les corps individuels ; la biopolitique
        porte sur la population.
      - Les technologies de l’information participent à l’organisation
        économique et politique des sociétés.

      ## La statistique et la mise en calcul du social

      La statistique rend visibles des régularités à l’échelle des
      populations. Taux, moyennes et catégories permettent de décrire
      des phénomènes collectifs et d’orienter des décisions publiques
      ou économiques.

      La tabulatrice d’Hollerith automatise le traitement de données
      représentées sur des cartes perforées. Employée pour le recensement
      américain de 1890, elle associe le codage des caractéristiques
      individuelles à leur décompte électrique.

      Les compagnies d’assurance contribuent également au développement
      de ces techniques. En agrégeant des dossiers, elles estiment
      des fréquences de sinistres, calculent des primes et répartissent
      les risques. La statistique ne prédit pas chaque destin individuel :
      elle transforme l’incertitude en grandeurs comparables à partir
      desquelles il devient possible d’agir.

      ### À retenir

      - Les données individuelles peuvent être codées, classées et
        agrégées pour produire un savoir sur une population.
      - Le calcul statistique sert au recensement, à l’administration
        et à la gestion des risques.
      - Les catégories ne sont pas neutres dans leurs effets :
        elles permettent de comparer, de tarifer, d’inclure ou d’exclure.

      ## Formaliser la logique et le calcul

      George Boole donne aux relations logiques une forme algébrique.
      Des expressions composées avec ET, OU et NON peuvent être évaluées
      selon des règles symboliques, indépendamment de leur contenu particulier.

      Alan Turing précise ensuite ce qu’est une procédure mécanique
      de calcul. Sa machine abstraite lit et écrit des symboles sur
      un ruban, se déplace et change d’état selon des règles de transition.
      Une machine universelle conserve ses propres règles mais interprète
      la description codée d’une autre machine pour en simuler l’exécution :
      le programme peut être traité comme une donnée.

      Claude Shannon établit un lien entre l’algèbre de Boole et
      les circuits de commutation. Des fonctions logiques peuvent être
      réalisées par des connexions électriques, notamment à l’aide de relais.

      ### À retenir

      - Boole algébrise des relations logiques ; Turing propose un modèle
        du calcul ; Shannon montre comment matérialiser des fonctions logiques.
      - L’universalité ne signifie pas qu’une machine peut résoudre
        tout problème : elle désigne ici sa capacité à simuler
        d’autres machines de Turing.
      - La machine de Turing est un modèle abstrait, distinct d’un
        ordinateur matériel à mémoire finie.

      ## Numériser : construire une représentation calculable

      La numérisation transforme une grandeur continue en une représentation
      discrète. Une image est découpée en pixels, dont la luminosité ou
      la couleur reçoit des valeurs numériques. Un son est échantillonné
      dans le temps, puis chaque mesure est quantifiée.

      La précision de cette représentation dépend du nombre de mesures
      et du nombre de valeurs disponibles pour les décrire. Le codage
      binaire permet ensuite de représenter ces valeurs par des suites
      de 0 et de 1.

      ### À retenir

      - Échantillonner consiste à sélectionner des mesures ; quantifier
        consiste à leur attribuer des valeurs parmi un ensemble discret.
      - Numériser et coder en binaire sont deux opérations distinctes.
      - Une représentation numérique ne reproduit pas intégralement
        le réel : elle le rend calculable à une certaine précision.

      ## La guerre et les premiers ordinateurs

      La Seconde Guerre mondiale accélère le financement de machines
      destinées à la cryptographie et aux calculs militaires. À Bletchley
      Park, la bombe de Turing et de ses collaborateurs élimine des
      configurations d’Enigma incompatibles avec les hypothèses des
      cryptanalystes. C’est une machine spécialisée, dont l’efficacité
      repose aussi sur le travail humain.

      Avec l’ENIAC, le calcul s’appuie sur des composants électroniques,
      mais la programmation passe encore par le câblage. Le travail
      des programmeuses est essentiel à son fonctionnement, bien que
      longtemps resté peu reconnu.

      L’EDVAC illustre le principe du programme enregistré : instructions
      et données sont conservées en mémoire. Le matériel peut ainsi
      exécuter différents programmes sans être recâblé pour chaque tâche.
      L’UNIVAC marque ensuite une étape vers la commercialisation
      civile de l’informatique, encore éloignée des usages personnels.

      ### À retenir

      - Les besoins militaires accélèrent la réalisation matérielle
        des techniques de calcul.
      - Une machine de cryptanalyse spécialisée n’est pas un ordinateur
        général à programme enregistré.
      - Le programme enregistré permet de changer les instructions
        sans reconstruire le mécanisme qui les exécute.

