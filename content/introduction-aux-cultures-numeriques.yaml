  - id: "internet-et-ordinateur-personnel"
    titre: "Histoire du numérique"
    partie: "3/3"
    sous-titre: "Internet et l’ordinateur personnel"
    slides:
      - titre: "Histoire du numérique · 3/3 — Internet et l’ordinateur personnel"
        url: "/slides/history-3/index.html"
        integration: "iframe"

    resume: |
      Cette troisième partie suit deux transformations qui finissent par se
      rejoindre : la mise en réseau d’ordinateurs éloignés et le passage de
      l’informatique institutionnelle à l’ordinateur personnel. Elle montre
      comment des choix techniques, des financements publics, des communautés
      de recherche et des imaginaires contre-culturels contribuent ensemble à
      former les cultures numériques contemporaines.

      Le parcours va des premières recherches sur les réseaux à commutation
      de paquets au Web, en passant par ARPANET, TCP/IP, le microprocesseur,
      l’Altair, Apple et l’IBM PC. Il se termine par la commercialisation du
      Web, la bulle des entreprises « dotcom » et le tournant participatif
      associé au Web 2.0.

      ## Distinguer Internet et le Web

      Internet est une infrastructure de communication : un réseau de réseaux
      qui fait circuler des paquets selon une famille de protocoles, notamment
      TCP/IP. Le Web est l’un des services qui utilise cette infrastructure.
      Il organise la consultation de ressources reliées par des hyperliens au
      moyen d’URL, de HTTP et de HTML.

      Cette distinction évite de confondre le support et l’un de ses usages.
      Le courrier électronique et le transfert de fichiers précèdent le Web ;
      d’autres applications peuvent apparaître sans modifier les principes
      fondamentaux d’Internet.

      ### À retenir

      - Internet relie des réseaux ; le Web relie des ressources consultables.
      - TCP/IP appartient à l’infrastructure d’Internet ; URL, HTTP et HTML
        structurent le Web.
      - Une même infrastructure peut accueillir des usages qui n’avaient pas
        été prévus lors de sa conception.

      ## Relier des réseaux : de la commutation par paquets à TCP/IP

      Le réseau téléphonique repose alors sur l’établissement d’un circuit
      réservé pendant la communication. La commutation par paquets découpe au
      contraire les données, permet à chaque paquet d’emprunter le réseau et
      reconstitue le message à l’arrivée. Les travaux de Paul Baran, Donald
      Davies et Leonard Kleinrock participent à cette transformation.

      ARPANET met ces principes à l’épreuve à partir de la fin des années 1960.
      Robert Kahn et Vint Cerf proposent ensuite une architecture capable de
      faire communiquer des réseaux différents. La séparation progressive de
      TCP et d’IP répartit les fonctions entre transport de bout en bout et
      acheminement des paquets.

      ### À retenir

      - La commutation par paquets partage les capacités du réseau entre des
        communications multiples.
      - ARPANET constitue un terrain d’expérimentation, mais ne se confond pas
        avec l’Internet mondial qui lui succède.
      - TCP/IP rend possible l’interconnexion de réseaux hétérogènes sans leur
        imposer une organisation interne unique.

      ## Du microprocesseur à l’ordinateur personnel

      La miniaturisation des composants déplace progressivement le calcul hors
      des grands centres informatiques. Circuits intégrés puis microprocesseurs
      rassemblent davantage de fonctions sur une puce, réduisant le coût et la
      taille des machines.

      L’Altair 8800 s’adresse d’abord aux amateurs capables d’assembler et de
      programmer leur propre machine. L’Apple I puis l’Apple II transforment ce
      bricolage en produit plus accessible. L’IBM PC contribue ensuite à fixer
      une architecture largement imitée, tandis que le Macintosh popularise
      une interface graphique commandée à la souris.

      ### À retenir

      - Le microprocesseur rend possible une nouvelle échelle de production et
        d’usage des ordinateurs.
      - Le passage du kit au produit grand public transforme les utilisateurs,
        les logiciels et les marchés.
      - L’ordinateur personnel résulte d’innovations techniques autant que de
        choix de conception, de diffusion et de standardisation.

      ## La contre-culture californienne et l’informatique comme outil

      Dans la baie de San Francisco, laboratoires de recherche, communautés
      hippies et clubs d’amateurs se côtoient sans former un milieu homogène.
      Stewart Brand joue un rôle de passeur entre ces mondes. Le *Whole Earth
      Catalog* rassemble des outils destinés à l’autonomie individuelle et
      collective ; Community Memory expérimente un accès public à l’échange
      informatisé ; le Homebrew Computer Club organise la circulation des
      savoirs autour des micro-ordinateurs.

      Cette histoire aide à comprendre comment l’ordinateur, auparavant perçu
      comme un instrument militaire, administratif ou industriel, peut aussi
      être présenté comme un outil personnel d’émancipation. Cette promesse ne
      suffit toutefois pas à expliquer seule le développement de l’industrie
      informatique californienne.

      ### À retenir

      - Les liens entre contre-culture et informatique passent par des lieux,
        des publications et des intermédiaires précis.
      - L’idée d’un « outil personnel » transforme l’imaginaire de l’ordinateur.
      - Coopération communautaire et développement marchand coexistent dès les
        débuts de la micro-informatique.

      ## D’ARPANET à Internet

      À mesure que les réseaux et leurs usages se multiplient, l’enjeu n’est
      plus seulement de relier quelques machines expérimentales. L’adoption de
      TCP/IP par ARPANET en 1983, la séparation des usages militaires et le
      développement de réseaux académiques comme NSFNET contribuent à former
      une infrastructure de plus grande échelle.

      Des communautés en ligne comme le WELL prolongent parallèlement les
      réseaux sociaux issus de la contre-culture. L’extension d’Internet repose
      donc sur des protocoles, des institutions et des usages collectifs, avant
      sa diffusion auprès du grand public.

      ### À retenir

      - Internet se construit comme une interconnexion de réseaux plutôt que
        comme un réseau central unique.
      - Les protocoles ouverts rendent compatibles des équipements et des
        organisations hétérogènes.
      - Son histoire engage des acteurs militaires, universitaires, publics,
        associatifs et commerciaux.

      ## Le Web, sa commercialisation et le tournant participatif

      À la fin des années 1980, Tim Berners-Lee propose au CERN un système
      hypertexte distribué pour relier des informations dispersées. Le Web
      combine un système d’adresses, un protocole d’échange et un langage de
      documents. Sa diffusion facilite l’accès à Internet sans abolir les
      autres services du réseau.

      L’ouverture du Web à des activités commerciales nourrit une croissance
      rapide et une spéculation qui culmine avec la bulle des « dotcom ».
      Après son éclatement, l’expression « Web 2.0 » désigne des services où
      les internautes publient, commentent et organisent eux-mêmes une part
      croissante des contenus. Cette participation alimente aussi de nouveaux
      modèles économiques fondés sur l’audience et les données.

      ### À retenir

      - Le Web associe URL, HTTP et HTML sur l’infrastructure d’Internet.
      - L’ouverture technique du Web ne détermine pas à elle seule ses modèles
        économiques ni la répartition du pouvoir entre ses acteurs.
      - Le Web 2.0 déplace une partie de la production éditoriale vers les
        utilisateurs et prépare l’essor des plateformes sociales.

