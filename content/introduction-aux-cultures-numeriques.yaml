  - id: "interpassivite-des-foules"
    titre: "L’interpassivité des foules"
    sous-titre: "Réseaux sociaux, croyance déléguée et désubjectivation"

    resume: |
      Les réseaux sociaux donnent à voir un flot continu de textes, d’images
      et de vidéos. Ce chapitre part de cette prolifération pour discuter
      une hypothèse : nous ne fréquentons pas seulement ces contenus pour
      nous exprimer ou découvrir ce que les autres ont à dire. Le flux peut
      aussi nous soulager d’avoir à parler, à choisir et à prendre position
      en notre nom propre. Le concept d’**interpassivité** permet d’analyser
      cette délégation de la passivité, du plaisir et de la croyance.

      ## De la promesse expressive à la parole normalisée

      L’imaginaire des premiers réseaux numériques associe la publication
      à l’expression de soi : chacun pourrait faire entendre une voix
      singulière sans passer par les filtres des médias traditionnels.
      Pourtant, l’activité et la visibilité restent très inégalement
      réparties. Une minorité produit l’essentiel des contenus tandis que
      la majorité observe, fait défiler, aime ou repartage.

      Les contenus générés par intelligence artificielle rendent cette
      contradiction particulièrement visible. Leur capacité à reproduire
      des formes expressives familières invite à retourner la question :
      si une machine peut imiter aussi facilement les publications humaines,
      est-ce aussi parce que celles-ci obéissent déjà à des formats répétitifs,
      prévisibles et statistiquement reconnaissables ?

      ## Publics imaginés, context collapse et recommandation

      Publier suppose d’anticiper un public. À la suite d’Erving Goffman,
      la présentation de soi peut être comprise comme un ajustement aux
      attentes d’une situation. Sur les réseaux sociaux, les amis, la famille,
      les collègues, les inconnus ou de futurs employeurs se rencontrent
      dans un même espace de visibilité. Ce **context collapse** fragilise
      les codes propres à chaque relation et favorise des énoncés génériques,
      capables de circuler entre des publics hétérogènes.

      Les systèmes de recommandation ajoutent une seconde audience :
      l’algorithme. Les utilisateurs apprennent les formats auxquels la
      plateforme accorde de la visibilité, puis les reproduisent. Ces
      ajustements peuvent former des boucles dans lesquelles les contenus
      déjà dominants deviennent plus visibles et plus souvent imités.

      ## L’interpassivité : déléguer la passivité et le plaisir

      Robert Pfaller appelle interpassivité la situation dans laquelle
      nous confions à un autre — personne, groupe, objet ou machine — le soin
      de consommer, de croire, de rire ou de jouir à notre place. Le chœur
      de la tragédie grecque éprouve les émotions du public ; les rires
      enregistrés indiquent qu’une émission est drôle ; le magnétoscope
      regarde symboliquement les films que son propriétaire n’aura peut-être
      jamais le temps de voir ; le moulin à prières prie pour celui qui
      l’actionne.

      Le doom-scrolling peut être relu depuis cette idée. Les autres vivent,
      parlent, s’indignent ou se divertissent devant nous. Leurs contenus
      nous permettent de participer à ces expériences tout en restant dans
      la position du spectateur. Le plaisir ne disparaît pas : il est pris
      en charge ailleurs, et cette délégation peut elle-même procurer
      une satisfaction.

      ## Être sujet face au flux

      Dans une perspective lacanienne, le sujet apparaît lorsque les mots,
      les habitudes et les normes ne suffisent plus à dicter une réponse.
      Parler à la première personne implique alors de choisir sans garantie,
      d’accepter l’ambivalence et de risquer le malentendu. Cette position
      est exigeante, d’autant que le surmoi contemporain ne commande pas
      seulement de respecter des interdits : il exige aussi d’être soi-même,
      de s’accomplir et d’afficher une vie singulière.

      Le flux algorithmique atténue provisoirement cette difficulté. Il
      remplit le silence par un prochain contenu, propose des affects et
      des opinions déjà formulés, puis permet d’y adhérer par un geste
      minimal. Un like, un partage, un emoji ou un slogan donnent l’apparence
      d’une prise de position sans exiger le même travail de formulation
      qu’une parole assumée.

      ## L’observateur naïf et la croyance des autres

      Pfaller nomme **observateur naïf** l’instance extérieure qui se satisfait
      des apparences. Un rituel accompli, un signe partagé ou une réaction
      visible peuvent attester que nous avons cru, agi ou pris position,
      quelles que soient nos intentions. Cette mise en scène permet de
      contourner momentanément le jugement plus exigeant du surmoi.

      Personne n’est pourtant nécessairement dupe. La croyance peut être
      déléguée à un « on » impersonnel : je fais comme si j’y croyais parce
      que les autres semblent y croire, tandis qu’ils agissent peut-être
      pour la même raison. Compteurs, tendances, commentaires et classements
      donnent une forme visible à cette croyance supposée.

      ## Observer la foule s’observer

      Les plateformes ne montrent pas seulement des expériences ; elles
      montrent aussi les réactions collectives à ces expériences. Chacun
      observe la foule regarder, aimer, commenter et partager. La foule
      numérique peut ainsi être comprise comme un ensemble d’individus qui
      renoncent temporairement à parler en leur nom pour se loger dans une
      parole déjà en circulation.

      Cette hypothèse ne réduit pas tout usage des réseaux sociaux à la
      passivité. Elle fournit un outil pour interroger le soulagement que
      peut procurer la délégation : que gagnons-nous lorsque d’autres parlent,
      croient ou éprouvent à notre place, et que perdons-nous lorsque le flux
      occupe les espaces de silence où une parole singulière pourrait surgir ?

      ### À retenir

      - Distinguer expression de soi, présentation de soi et normalisation
        des formes expressives.
      - Définir l’interpassivité comme une délégation de la passivité,
        du plaisir ou de la croyance.
      - Relier le context collapse et les systèmes de recommandation à
        l’homogénéisation possible des contenus.
      - Comprendre comment le flux et les réactions préformatées peuvent
        dispenser provisoirement de parler à la première personne.
      - Analyser les métriques sociales comme une représentation de la foule
        en train de s’observer et de valider ses propres signes.

