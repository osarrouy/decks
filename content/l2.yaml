        note: "Lire l’introduction et la conclusion avant d’aborder le détail du protocole."

  - id: "consensus-sans-tiers-de-confiance"
    titre: "Blockchain"
    sous-titre: "Produire un consensus sans tiers de confiance"
    slides:
      - titre: "Blockchain — Registre, consensus et preuve de travail"
        url: "/slides/blockchain-consensus/index.html"
        integration: "iframe"

    resume: |
      Comment tenir un registre commun sans confier sa gestion à une autorité
      centrale ? À partir de Bitcoin, ce chapitre suit la construction d’un
      consensus entre des participants qui ne se connaissent pas et peuvent
      chercher à se tromper. Il articule réseau pair à pair, preuve de travail
      et chaînage cryptographique, puis examine les conditions matérielles,
      probabilistes et économiques de cette sécurité.

      ## Du client–serveur au réseau pair à pair

      Dans le modèle client–serveur présenté, les clients consultent un
      registre tenu par un serveur central. Dans Bitcoin, les nœuds échangent
      les informations de proche en proche et vérifient les données reçues.
      Comme avec BitTorrent, les participants peuvent recevoir et transmettre
      des données. Mais partager un registre monétaire exige aussi de
      s’accorder sur les transactions à y inscrire.

      ## Des premières monnaies numériques à la double dépense

      *b-money*, proposé par Wei Dai en 1998, et *Bit Gold*, décrit par Nick
      Szabo en 2005, explorent déjà la tenue d’un registre distribué et la
      création d’unités par le calcul. Bitcoin assemble ces pistes autour
      d’un problème décisif : empêcher qu’Alice dépense les mêmes bitcoins
      auprès de Bob et de Charlie. Comme les nœuds ne reçoivent pas tous les
      messages dans le même ordre, ils doivent disposer d’une règle commune
      pour départager les historiques concurrents.

      ## Blocs, branches concurrentes et preuve de travail

      Les mineurs regroupent des transactions dans des blocs. Les nœuds
      vérifient leur conformité aux règles du protocole et rejettent les blocs
      invalides. Deux blocs valides peuvent toutefois apparaître presque
      simultanément et former deux branches : le réseau poursuit alors la
      chaîne valide qui cumule le plus de travail.

      La preuve de travail rend la production des blocs coûteuse, tandis que
      sa vérification reste rapide. Elle empêche de gagner de l’influence
      simplement en multipliant les identités, comme dans une attaque Sybil :
      les chances de produire un bloc dépendent de la puissance de calcul
      mobilisée. La difficulté est réajustée tous les 2 016 blocs pour viser
      un bloc toutes les dix minutes en moyenne sur l’ensemble du réseau.

      ## Empreintes, réécriture et confirmations

      Chaque bloc contient l’empreinte numérique, ou *hash*, du précédent.
      Une modification change cette empreinte et rompt le lien avec la suite.
      Réécrire l’historique exige donc de refaire les preuves de travail des
      blocs concernés, puis de dépasser le travail de la chaîne que les autres
      mineurs continuent de prolonger.

      Les confirmations comptent le bloc qui contient une transaction, puis
      ceux qui le suivent. Tant que l’attaquant dispose d’une puissance
      minoritaire et que les communications fonctionnent normalement, leur
      accumulation réduit ses chances de rattraper la chaîne. Une attaque dite
      « des 51 % » désigne le contrôle de la majorité de la puissance de
      calcul. La validité d’un paiement et sa stabilité dans l’historique sont
      ainsi deux questions distinctes.

      ## Le coût matériel et politique du minage

      Cette protection consomme de l’électricité et mobilise des machines
      spécialisées, les ASIC. Le rapport de Cambridge publié en 2025 permet
      d’en examiner l’empreinte énergétique. Le coût du matériel et l’accès à
      une électricité bon marché favorisent de grandes installations ; les
      *pools* regroupent des mineurs pour partager les revenus. L’ouverture du
      réseau coexiste donc avec une concentration des moyens de produire les
      blocs.

      ## Des incitations économiques à la sécurité du registre

      Les bitcoins nouvellement émis et les frais de transaction rémunèrent
      le producteur d’un bloc conservé dans l’historique. Le protocole cherche
      ainsi à rendre la participation au réseau plus profitable qu’une
      attaque. Il intègre une logique de *mechanism design* : organiser les
      règles et les gains pour que des intérêts individuels contribuent à un
      résultat collectif.

      La valeur du bitcoin, les revenus du minage, la puissance de calcul
      engagée et la confiance dans le registre s’influencent mutuellement.
      Cette articulation produit une sécurité pratique, fondée sur des
      probabilités et des incitations. Elle ne rend pas toute attaque
      impossible et ne garantit pas qu’attaquer serait toujours non rentable.

      ### À retenir

      - Le consensus permet de départager des historiques concurrents et d’éviter la double dépense.
      - Les mineurs proposent des blocs ; les nœuds vérifient qu’ils respectent les règles.
      - Bitcoin retient la chaîne valide qui cumule le plus de travail, pas celle soutenue par le plus d’identités.
      - Le chaînage et la preuve de travail rendent la réécriture coûteuse ; les confirmations en réduisent le risque sous certaines conditions.
      - Cette sécurité combine cryptographie, probabilités et incitations, avec un coût énergétique et des risques de concentration.

