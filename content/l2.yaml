  - id: "mechanism-design"
    titre: "Mechanism design"
    sous-titre: "Gouverner par les incitations"
    slides:
      - titre: "Mechanism design — Gouverner par les incitations"
        url: "/slides/blockchain-mechanism-design/index.html"
        integration: "iframe"

    resume: |
      Le *mechanism design* part d’un problème inverse de celui de
      l’observation économique : il ne demande pas seulement quelles règles
      expliquent un comportement, mais quelles règles produire pour obtenir un
      résultat déterminé. Les intérêts individuels deviennent alors les
      composants d’un dispositif de coordination.

      Le stablecoin sert de fil conducteur. La création et la destruction de
      monnaie, la surcollatéralisation et la liquidation doivent inciter chaque
      participant à agir dans son propre intérêt tout en contribuant à la
      stabilité du système. Cette régulation automatisée rapproche la
      blockchain des boucles de rétroaction étudiées par la cybernétique.

      Hayek, l’ordre spontané, le jeu de la vie, Schelling et la taxe Harberger
      permettent ensuite d’examiner la même hypothèse à différentes échelles :
      un ordre collectif peut émerger de règles locales, mais son résultat
      dépend entièrement de la manière dont ces règles ont été conçues.

      ### À retenir

      - Une incitation traduit une finalité politique en environnement de choix.
      - L’ordre émergent n’est pas nécessairement juste ni souhaitable.
      - Concevoir un marché revient aussi à distribuer du pouvoir.

    bibliographie:
      - reference: "Hayek, F. A. (1945). The use of knowledge in society. *The American Economic Review, 35*(4), 519–530. [https://www.econlib.org/library/Essays/hykKnw.html](https://www.econlib.org/library/Essays/hykKnw.html)"
        url: "https://www.econlib.org/library/Essays/hykKnw.html"
        note: "Texte central sur les prix comme mécanisme d’agrégation d’informations dispersées."

      - reference: "Posner, E. A., & Weyl, E. G. (2018). *Radical markets: Uprooting capitalism and democracy for a just society*. Princeton University Press."
        note: "Lire le chapitre consacré à la propriété commune et à la taxe Harberger."

      - reference: "Roughgarden, T. (s. d.). *Incentives in computer science* [Cours vidéo]. [https://www.timroughgarden.algorithmsilluminated.org/videos.html](https://www.timroughgarden.algorithmsilluminated.org/videos.html)"
        url: "https://www.timroughgarden.algorithmsilluminated.org/videos.html"
        note: "Cours progressif sur les incitations, les marchés numériques et la théorie des jeux appliquée à Bitcoin."

      - reference: "Roughgarden, T., Kominers, S. D., & Garimidi, P. (2024, 11 juillet). *Conversation on incentives* [Vidéo]. a16z crypto. [https://a16zcrypto.com/posts/videos/conversation-on-incentives/](https://a16zcrypto.com/posts/videos/conversation-on-incentives/)"
        url: "https://a16zcrypto.com/posts/videos/conversation-on-incentives/"
        note: "Discussion accessible sur les liens entre incitations, marchés et infrastructure blockchain."

  - id: "gouvernance-decentralisee"
    titre: "Gouvernance décentralisée"
    sous-titre: "DAO et fabrication d’une volonté collective"
    slides:
      - titre: "Gouvernance décentralisée — DAO et systèmes de vote"
        url: "/slides/blockchain-gouvernance/index.html"
        integration: "iframe"

    resume: |
      Une DAO cherche à coordonner des participants, des ressources et des
      décisions à partir de règles publiques exécutées sur une blockchain.
      Cette ambition déplace le problème de la souveraineté : comment produire
      une volonté collective lorsque l’organisation ne dispose ni d’une
      direction centrale ni d’un corps politique clairement délimité ?

      Le chapitre compare plusieurs réponses. Le vote pondéré par les tokens
      transforme la richesse en pouvoir. Le vote par personne réclame une
      preuve d’unicité. La réputation mesure les contributions passées. Le
      verrouillage de tokens ajoute un engagement dans le temps, tandis que le
      vote quadratique cherche à représenter l’intensité des préférences.

      La futarchie pousse cette logique plus loin en confiant aux marchés
      prédictifs le choix des moyens. Chaque mécanisme fabrique une certaine
      foule, sélectionne les comportements qui comptent et produit ses propres
      exclusions.

      ### À retenir

      - Une DAO combine infrastructure technique et règles d’organisation.
      - Aucun système de vote ne résout simultanément identité, égalité, compétence et engagement.
      - Les mécanismes d’agrégation construisent la volonté collective qu’ils prétendent mesurer.

