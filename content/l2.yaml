  - id: "monnaie-valeur-confiance"
    titre: "Monnaie"
    sous-titre: "Valeur, confiance et histoire des échanges"
    slides:
      - titre: "Monnaie — Valeur, confiance et histoire des échanges"
        url: "/slides/blockchain-monnaie/index.html"
        integration: "iframe"

    resume: |
      Pourquoi Bitcoin possède-t-il une valeur ? La question oblige à revenir
      aux monnaies ordinaires. Une monnaie sert d’unité de compte,
      d’instrument d’échange et de réserve de valeur. Ces fonctions facilitent
      les échanges, mais elles rendent aussi les biens, les activités et les
      rapports sociaux comparables à partir d’une même mesure.

      Le chapitre critique le récit selon lequel la monnaie aurait simplement
      remplacé le troc. Les systèmes de crédit et de dette précèdent souvent la
      monnaie frappée. Sa généralisation accompagne aussi la fiscalité, les
      armées et la formation des États, qui imposent une unité dans laquelle
      les populations doivent payer l’impôt.

      Une monnaie tient finalement à une confiance distribuée : chacun
      l’accepte parce qu’il pense que les autres l’accepteront. Bitcoin tente
      de produire cette croyance commune sans l’adosser directement à un État.

      ### À retenir

      - Les fonctions de la monnaie ne suffisent pas à expliquer son histoire.
      - Monnaie, dette, impôt et pouvoir politique se développent ensemble.
      - La valeur dépend d’institutions et d’anticipations partagées.

    bibliographie:
      - reference: "Graeber, D. (2011). *Debt: The first 5,000 years*. Melville House."
        note: "Lire en priorité les chapitres consacrés au mythe du troc et aux premières économies de crédit."

      - reference: "La vie manifeste. (2018, 20 décembre). *Dette, 5000 ans d’histoire, David Graeber* [Podcast]. Apple Podcasts. [https://podcasts.apple.com/fr/podcast/dette-5000-ans-dhistoire-david-graeber/id1448207766?i=1000426832135](https://podcasts.apple.com/fr/podcast/dette-5000-ans-dhistoire-david-graeber/id1448207766?i=1000426832135)"
        url: "https://podcasts.apple.com/fr/podcast/dette-5000-ans-dhistoire-david-graeber/id1448207766?i=1000426832135"
        note: "Entretien introductif sur la dette, le crédit et le mythe du troc."

      - reference: "McLeay, M., Radia, A., & Thomas, R. (2014). Money creation in the modern economy. *Bank of England Quarterly Bulletin, 54*(1), 14–27. [https://www.bankofengland.co.uk/quarterly-bulletin/2014/q1/money-creation-in-the-modern-economy](https://www.bankofengland.co.uk/quarterly-bulletin/2014/q1/money-creation-in-the-modern-economy)"
        url: "https://www.bankofengland.co.uk/quarterly-bulletin/2014/q1/money-creation-in-the-modern-economy"
        note: "La page comprend aussi une courte vidéo sur la création monétaire par le crédit bancaire."

  - id: "ethereum"
    titre: "Ethereum"
    sous-titre: "De la transaction au programme"
    slides:
      - titre: "Ethereum — Smart contracts, dApps et wallets"
        url: "/slides/blockchain-ethereum/index.html"
        integration: "iframe"

    resume: |
      Ethereum étend le principe du registre distribué à l’exécution de
      programmes. Une transaction peut appeler un *smart contract*, modifier
      son état et déclencher automatiquement des opérations. La blockchain
      devient alors une machine partagée sur laquelle des applications
      décentralisées peuvent être déployées.

      Le chapitre compare preuve de travail et preuve d’enjeu, puis présente
      le rôle des wallets. Une adresse publique identifie un compte ; la clé
      privée permet d’autoriser une opération. Contrôler un wallet signifie
      donc contrôler à la fois une identité cryptographique et les actifs qui
      lui sont associés.

      Une séquence pratique conduit les étudiants de la création d’un wallet à
      l’obtention d’ETH de test, puis à la connexion et à l’utilisation d’une
      dApp. Elle rend visibles les choix, autorisations et responsabilités que
      l’interface masque habituellement.

      ### À retenir

      - Ethereum ajoute des programmes au registre distribué.
      - Les smart contracts exécutent des règles partagées par le réseau.
      - Un wallet gère des clés et signe des opérations ; il ne contient pas matériellement les jetons.

