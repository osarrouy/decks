titre: "Blockchain et crypto-monnaies"
niveau: "L2"

description: |
  Ce cours étudie la blockchain comme une tentative de produire de la
  confiance sans la confier à une institution centrale. Il part de Bitcoin,
  de son héritage cypherpunk et de sa critique des politiques monétaires,
  puis examine les mécanismes techniques qui permettent à un réseau distribué
  de tenir un registre commun.

  Le parcours élargit ensuite la question. Avec Ethereum, la blockchain ne
  sert plus seulement à enregistrer des transactions : elle devient une
  infrastructure programmable capable d’exécuter des applications. Cette
  possibilité conduit au *mechanism design*, à la conception de dispositifs
  qui orientent les comportements par des règles et des incitations
  économiques.

  Les DAO, les systèmes de vote et les NFT permettent enfin d’interroger les
  formes politiques et culturelles issues de cette logique. Le cours articule
  ainsi compréhension technique, histoire de la monnaie et analyse critique
  des promesses de décentralisation.

